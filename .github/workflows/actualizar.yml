name: Actualizar inventario

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (UTC); GitHub puede demorarlo unos minutos
  workflow_dispatch:          # boton "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bajar el mundo desde G-Portal
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: ${{ secrets.FTP_TLS }}
          FTP_WORLD_DIR: ${{ secrets.FTP_WORLD_DIR }}
        run: python arcon/fetch_ftp.py world
      - name: Armar la pagina
        run: |
          python arcon/build.py world site/pancheim/index.html
          cp index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
