<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundos de Valheim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a short list of worlds; same tokens as the Arcón pages. */
:root {
  --bg: #e9eef0; --panel: #f7f9fa; --ink: #1d2830; --muted: #5b6b75; --line: #cdd7dc;
  --accent: #96641f; --accent-soft: #f1e4cf;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12181c; --panel: #1a2228; --ink: #e2e8eb; --muted: #93a3ac; --line: #2c3840;
  --accent: #d6a45a; --accent-soft: #3a2e1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12181c; --panel: #1a2228; --ink: #e2e8eb; --muted: #93a3ac; --line: #2c3840;
  --accent: #d6a45a; --accent-soft: #3a2e1c; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 48px 64px; display: grid; gap: 24px; }
h1 { font: 700 clamp(2rem, 6vw, 2.6rem)/1.05 var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; color: var(--muted); max-width: 60ch; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
a.world { display: grid; gap: 2px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: inherit; text-decoration: none; }
a.world:hover, a.world:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.w-name { font: 700 1.3rem var(--display); }
.w-path { font: .85rem var(--mono); color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mundos de Valheim</h1>
  <p>Lo que tenemos guardado en cada servidor, actualizado solo cada dos horas.</p>
  <ul>
    <li><a class="world" href="pancheim/"><span class="w-name">Pancheim</span><span>Arcón: todo lo que hay en cofres, vehículos y tumbas, y el estado de las estaciones.</span><span class="w-path">/valheim/pancheim/</span></a></li>
  </ul>
</main>
</body>
</html>
